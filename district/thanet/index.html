// Load the shared district template inline
// We can't iframe due to CORS, so we load it via fetch and inject
(async function() {

    const r = await fetch('/district/index.html');
    const html = await r.text();
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    window.location.href = '/district/index.html';
  }
})();
</script>
