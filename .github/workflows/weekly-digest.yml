name: Weekly Intelligence Digest

# Runs every Monday at 07:00 UTC
# Generates a weekly report card for assistiv.cloud and emails it to simon@assistiv.co
# Requires one GitHub Actions secret:
#   RESEND_API_KEY — from resend.com (free tier, 3,000 emails/month)
# Also requires a verified sending domain in Resend (assistiv.cloud)

on:
  schedule:
    - cron: '0 7 * * 1'    # 07:00 UTC every Monday
  workflow_dispatch:         # manually triggerable from Actions tab

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --break-system-packages

      - name: Generate weekly digest and send email
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python weekly_digest.py

      - name: Commit digest files
        run: |
          git config user.name  "Assistiv Digest Bot"
          git config user.email "digest@assistiv.cloud"
          git add logs/digest-*.md logs/digest-latest.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "digest: weekly intelligence report $(date +%Y-W%V)"
          git push
