name: Weekly Intelligence Digest

# Runs every Monday at 07:00 UTC
# Generates a weekly report card for assistiv.cloud covering:
#   - FEP score movement and alerts
#   - Agent question summary and rated responses
#   - Winter deployment windows
#   - Prescribing outliers
#   - Data freshness status
# Commits digest to logs/digest-YYYY-WW.md and updates logs/digest-latest.json

on:
  schedule:
    - cron: '0 7 * * 1'    # 07:00 UTC every Monday
  workflow_dispatch:         # manually triggerable from Actions tab

permissions:
  contents: write

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests --break-system-packages

      - name: Generate weekly digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python weekly_digest.py

      - name: Commit digest
        run: |
          git config user.name  "Assistiv Digest Bot"
          git config user.email "digest@assistiv.cloud"
          git add logs/digest-*.md logs/digest-latest.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "digest: weekly intelligence report $(date +%Y-W%V)"
          git push
